<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Your Nordwood in your yard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--g:#002e17;--g2:#159d59;--g3:#0f7a45;--amber:#e0a038;--ink:#17241b;--mut:#5d6b63;--line:#dfe6e1;--bg:#f4f7f3;--card:#fff;--tint:#eaf7ee}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}
  .top{background:var(--g);color:#fff;padding:22px 0 26px}
  .top .wrap{padding-bottom:0}
  .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700;margin:0 0 8px}
  h1{font-family:"Roboto Condensed",Arial Narrow,sans-serif;font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.02;margin:0 0 8px;text-transform:uppercase;text-wrap:balance}
  h1 em{font-style:normal;color:#9ad1a8}
  .sub{margin:0;color:rgba(255,255,255,.82);font-size:15px}
  h2{font-family:"Roboto Condensed",Arial Narrow,sans-serif;font-weight:800;font-size:24px;text-transform:uppercase;margin:30px 0 6px;color:var(--g)}
  .lede{margin:0 0 12px;color:var(--mut);font-size:15px}
  .ba{position:relative;border-radius:16px;overflow:hidden;background:#dfe6e1;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:0 10px 30px -18px rgba(0,46,23,.45)}
  .ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .ba .after{clip-path:inset(0 0 0 var(--pos,50%))}
  .ba .bar{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .ba .knob{position:absolute;top:50%;left:var(--pos,50%);width:46px;height:46px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.3);color:var(--g)}
  .ba .knob svg{width:24px;height:24px}
  .ba .tag{position:absolute;top:12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:5px 10px;border-radius:999px;backdrop-filter:blur(4px)}
  .ba .tag.l{left:12px;opacity:var(--ol,1)} .ba .tag.r{right:12px;opacity:var(--or,1)}
  .ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}
  .shot{margin:0 0 18px} .shot .cap{font-size:13px;color:var(--mut);margin:8px 2px 0}
  .plan{position:relative;border-radius:16px;overflow:hidden;background:#e8ece6;box-shadow:0 10px 30px -18px rgba(0,46,23,.45)}
  .plan canvas{display:block;width:100%;touch-action:none}
  .plan .hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
  .tools button{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--g);border-radius:999px;padding:8px 14px;cursor:pointer}
  .tools button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
  .tools label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);flex:1;min-width:150px}
  .tools input[type=range]{flex:1;accent-color:var(--g2)}
  .note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0 0}
  .note .who{display:flex;gap:12px;align-items:center;margin:0 0 10px}
  .note .av{width:44px;height:44px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;font-family:"Roboto Condensed",sans-serif;font-size:18px}
  .note .who b{display:block} .note .who small{color:var(--mut)}
  .note p{margin:0;white-space:pre-line}
  .cta{display:grid;gap:10px;margin:18px 0 0}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--g2);color:#fff;font-weight:700;text-decoration:none;padding:16px 18px;border-radius:14px;font-size:17px}
  .btn.alt{background:#fff;color:var(--g);border:2px solid var(--g)} .btn.amber{background:var(--amber);color:#1b1404}
  .btn svg{width:22px;height:22px;flex:none}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0}
  .fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .fact small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600} .fact b{font-size:17px}
  footer{margin-top:40px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:14px}
  .wait{text-align:center;padding:60px 0} .draftbar{background:var(--amber);color:#1b1404;font-size:13px;font-weight:700;text-align:center;padding:6px}
  @media(min-width:700px){.ba,.plan{border-radius:20px}}
</style></head><body>

  const S = { x: D.plan.spot ? D.plan.spot.x : 0, y: D.plan.spot ? D.plan.spot.y : 8, rot: D.plan.spot ? D.plan.spot.rot : 0 };
  const start = { ...S }; $('#rot').value = S.rot;
  let W = 0, DPR = 1, view = { cx: S.x, cy: S.y, s: 1 };
  function size() { const r = box.getBoundingClientRect(); DPR = Math.min(2, devicePixelRatio || 1); W = Math.round(r.width); cv.width = W * DPR; cv.height = W * DPR; cv.style.height = W + 'px'; view.s = W / Math.min(spanM, 70); draw(); }
  const toS = (x, y) => [(x - view.cx) * view.s + W / 2, (y - view.cy) * view.s + W / 2];
  const toM = (sx, sy) => [(sx - W / 2) / view.s + view.cx, (sy - W / 2) / view.s + view.cy];
  function poly() { const a = S.rot * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a); return pts.map(([x, y]) => { const lx = x - shape.w / 2, ly = y - shape.h / 2; return [S.x + lx * ca - ly * sa, S.y + lx * sa + ly * ca]; }); }
  function draw() {
    c.setTransform(DPR, 0, 0, DPR, 0, 0); c.fillStyle = '#e8ece6'; c.fillRect(0, 0, W, W);
    const im = art; if (im.complete && im.naturalWidth) { const sq = Math.min(im.naturalWidth, im.naturalHeight), [x0, y0] = toS(-spanM / 2, -spanM / 2); c.drawImage(im, (im.naturalWidth - sq) / 2, (im.naturalHeight - sq) / 2, sq, sq, x0, y0, spanM * view.s, spanM * view.s); }
    const p = poly().map(([x, y]) => toS(x, y));
    if (fpImg.complete && fpImg.naturalWidth) { const [cx, cy] = toS(S.x, S.y), iw = shape.w * view.s, ih = shape.h * view.s; c.save(); c.translate(cx, cy); c.rotate(S.rot * Math.PI / 180); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 8; c.shadowOffsetX = 2; c.shadowOffsetY = 3; c.drawImage(fpImg, -iw / 2, -ih / 2, iw, ih); c.restore(); }
    else { c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 10; c.shadowOffsetY = 3; c.beginPath(); p.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); c.fillStyle = 'rgba(206,232,215,.96)'; c.fill(); c.restore();
    c.beginPath(); p.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); c.lineWidth = 2.4; c.strokeStyle = '#0b5d34'; c.stroke(); }
    const xs = p.map((q) => q[0]), ys = p.map((q) => q[1]), tx = (Math.min(...xs) + Math.max(...xs)) / 2, ty = Math.max(...ys) + 18;
    c.font = '700 12px Inter, sans-serif'; const label = NAMES[D.product] || 'Greenhouse', w = c.measureText(label).width + 20;
    c.beginPath(); c.roundRect(tx - w / 2, ty - 12, w, 24, 12); c.fillStyle = '#0b5d34'; c.fill(); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, tx, ty + 0.5); c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    const ftPx = FT * view.s, total = [10, 20, 40, 50, 100].find((v) => v * ftPx >= 70) || 100, bw = total * ftPx, bx = 14, by = W - 18;
    c.fillStyle = 'rgba(255,255,255,.92)'; c.fillRect(bx - 8, by - 22, bw + 40, 34);
    for (let i = 0; i < 4; i++) { c.fillStyle = i % 2 ? '#fff' : '#1a1b18'; c.fillRect(bx + i * bw / 4, by, bw / 4, 5); } c.strokeStyle = '#1a1b18'; c.lineWidth = 1; c.strokeRect(bx, by, bw, 5);
    c.fillStyle = '#1a1b18'; c.font = '600 10px Inter, sans-serif'; c.fillText('0', bx - 2, by - 5); c.fillText(total + ' ft', bx + bw - 10, by - 5);
    // rotate handle at the top-right corner of the footprint: drag it around the centre to rotate (2 degree steps)
    handle = [Math.max(...xs) + 16, Math.min(...ys) - 8];
    c.save(); c.translate(handle[0], handle[1]);
    c.beginPath(); c.arc(0, 0, 12, 0, 7); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#17241b'; c.stroke();
    // circular arrow: 270 degree arc ending in a filled arrowhead
    c.lineWidth = 1.8; c.lineCap = 'round'; c.beginPath(); c.arc(0, 0, 5.5, -Math.PI * 0.95, Math.PI * 0.55); c.stroke();
    const ea = Math.PI * 0.55, tx2 = 5.5 * Math.cos(ea), ty2 = 5.5 * Math.sin(ea), dir = ea + Math.PI / 2;
    c.beginPath(); c.moveTo(tx2 + 3.6 * Math.cos(dir), ty2 + 3.6 * Math.sin(dir)); c.lineTo(tx2 + 3 * Math.cos(dir + 2.3), ty2 + 3 * Math.sin(dir + 2.3)); c.lineTo(tx2 + 3 * Math.cos(dir - 2.3), ty2 + 3 * Math.sin(dir - 2.3)); c.closePath(); c.fillStyle = '#17241b'; c.fill();
    c.restore();
    if (rotLabel != null) { c.font = '700 13px Inter, sans-serif'; c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.7)'; c.fillStyle = '#fff'; c.strokeText(S.rot + '°', handle[0] + 22, handle[1] + 5); c.fillText(S.rot + '°', handle[0] + 22, handle[1] + 5); }
  }
  let drag = null, handle = [0, 0], rotLabel = null;
  cv.addEventListener('pointerdown', (e) => { const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top; $('#planHint').style.display = 'none'; cv.setPointerCapture(e.pointerId);
    if (Math.hypot(sx - handle[0], sy - handle[1]) < 26) { const [cx0, cy0] = toS(S.x, S.y); drag = { rot: true, cx: cx0, cy: cy0, a0: Math.atan2(sy - cy0, sx - cx0), r0: S.rot }; rotLabel = S.rot; draw(); return; }
    const [mx, my] = toM(sx, sy); drag = { dx: S.x - mx, dy: S.y - my }; });
  cv.addEventListener('pointermove', (e) => { if (!drag) return; const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
    if (drag.rot) { const a = Math.atan2(sy - drag.cy, sx - drag.cx); S.rot = ((Math.round((drag.r0 + (a - drag.a0) * 180 / Math.PI) / 2) * 2) % 360 + 360) % 360; rotLabel = S.rot; $('#rot').value = S.rot; draw(); return; }
    const [mx, my] = toM(sx, sy); S.x = mx + drag.dx; S.y = my + drag.dy; draw(); });
  cv.addEventListener('pointerup', () => { drag = null; rotLabel = null; draw(); });
  $('#rot').oninput = (e) => { S.rot = +e.target.value; draw(); };
  const reset = $('#resetSpot'); if (reset) reset.onclick = () => { Object.assign(S, start); $('#rot').value = S.rot; draw(); };
  art.onload = draw; window.addEventListener('resize', size); size();
}
render();
</script></body></html>
