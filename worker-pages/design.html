:root{
  --ygh-green-dark:#002e17;--ygh-green:#159d59;--ygh-green-button:#00934a;
  --ygh-green-mint:#f1ffef;--ygh-green-text:#2f5233;--ygh-shadow:#1f3f29;
  --ygh-ink:#1a1b18;--ygh-grey:#5a5d56;--ygh-grey-light:#dadee5;
  --ygh-font-heading:"Bootstrap Alternate Pro","Rockwell","Roboto Slab",Georgia,serif;
  --ygh-font-body:"IBM Plex Sans",system-ui,sans-serif;
  --ygh-font-highlight:"Roboto Condensed","Arial Narrow",sans-serif;
  --ygh-hard-shadow:4px 4px 0 0 var(--ygh-shadow);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#c9cfc8}
body{font-family:var(--ygh-font-body);color:var(--ygh-grey);-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:Letter;margin:0}
.page{width:8.5in;height:11in;margin:24px auto;background:#fff;position:relative;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.18)}
@media print{html,body{background:none}.page{margin:0;box-shadow:none;break-after:page}}
@media screen and (max-width:860px){.page{zoom:calc(100vw / 8.9in)}}
a{color:inherit;text-decoration:none}

/* page frame, same on every page like Alex's */
.hdr{position:absolute;top:.38in;left:.6in;right:.6in;display:flex;justify-content:space-between;font:500 8.5pt/1 var(--ygh-font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ygh-grey);z-index:5}
.hdr b{font-weight:700;color:var(--ygh-green-dark)} .hdr i{font-style:normal;font-weight:700;color:var(--ygh-green)}
.ftr{position:absolute;bottom:.32in;left:.6in;right:.6in;border-top:1px solid var(--ygh-grey-light);padding-top:.13in;display:flex;justify-content:space-between;align-items:center;font:500 9pt/1 var(--ygh-font-body);color:var(--ygh-grey);z-index:5}
.dark-foot .ftr{border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.7)}
.logo{display:flex;align-items:center}
.logo img{height:22px;display:block}
.logo span{font:800 11pt/1 var(--ygh-font-highlight);letter-spacing:.1em;color:var(--ygh-green-dark)}
.dark-foot .ftr .logo span{color:#fff}

/* type */
.h1{font-family:var(--ygh-font-heading);font-weight:400;text-transform:uppercase;color:var(--ygh-green-dark);line-height:1.04;letter-spacing:.8px}
.h1 em{font-family:var(--ygh-font-highlight);font-style:normal;font-weight:800;background:var(--ygh-green);color:#fff;padding:.02em .2em;border-radius:3px;letter-spacing:.02em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.p{font:400 12.5pt/1.7 var(--ygh-font-body);color:var(--ygh-grey)}
.p b{color:var(--ygh-green-dark);font-weight:600}
.c{text-align:center}
.wrap{position:absolute;left:.6in;right:.6in}
.band{position:absolute;left:0;right:0;bottom:0;background:var(--ygh-green-dark);color:#fff}
.band .p{color:rgba(255,255,255,.82)} .band .p b{color:#fff}
.band .h1{color:#fff}
.ph{width:100%;height:100%;background:linear-gradient(135deg,#e9eee6,#d9e0d4);display:flex;align-items:center;justify-content:center;text-align:center;font:500 10pt/1.4 var(--ygh-font-body);color:#7c8478}
.img{width:100%;height:100%;background-size:cover;background-position:center}
.frame{border-radius:8px;overflow:hidden;border:1.5px solid var(--ygh-shadow);box-shadow:var(--ygh-hard-shadow);background:#e6ebe3}
.wrap.frame,.frame{position:absolute}
.rel{position:relative!important}
.tag{position:absolute;top:12px;left:12px;padding:6px 11px;border-radius:3px;background:rgba(0,46,23,.9);color:#fff;font:800 9pt/1 var(--ygh-font-highlight);letter-spacing:.14em;text-transform:uppercase;z-index:2}
.tag.g{background:var(--ygh-green)}
.ba{--pos:50%;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.ba__layer{position:absolute;inset:0}
.ba__layer img{display:block;width:100%;height:100%;object-fit:cover}
.ba__before{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.ba .tag{z-index:3;transition:opacity .15s linear;pointer-events:none}
.ba .ba__tag--r{left:auto;right:12px}
.ba__line{position:absolute;top:0;bottom:0;left:var(--pos);z-index:2;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,46,23,.15);pointer-events:none}
.ba__knob{position:absolute;top:50%;left:var(--pos);z-index:3;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--ygh-green-dark)}
.ba__knob svg{width:16px;height:16px}
.ba__count{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;padding:5px 10px;border-radius:20px;background:rgba(0,46,23,.75);color:#fff;font:700 9pt/1 var(--ygh-font-body);pointer-events:none}
.ba input{position:absolute;inset:0;z-index:4;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}

/* icon row, like Alex's 4 icons */
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:.2in;text-align:center}
.icons svg{width:58px;height:58px;display:block;margin:0 auto 12px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icons .t{font:400 15pt/1.05 var(--ygh-font-heading);text-transform:uppercase;letter-spacing:.6px;color:#fff;margin-bottom:6px}
.icons .s{font:400 10pt/1.45 var(--ygh-font-body);color:rgba(255,255,255,.75)}
.icons.lt svg{stroke:var(--ygh-green)} .icons.lt .t{color:var(--ygh-green-dark)} .icons.lt .s{color:var(--ygh-grey)}

/* cover */
.cv-top{position:absolute;top:0;left:0;right:0;height:3.05in;background:var(--ygh-green-dark);display:flex;align-items:center;justify-content:center}
.cv-top .h1{color:#fff;font-size:52pt;text-align:center;line-height:1.02}
.cv-bar{position:absolute;top:3.05in;left:0;right:0;height:.62in;background:var(--ygh-green);display:flex;align-items:center;justify-content:center}
.cv-bar span{font:800 12pt/1 var(--ygh-font-highlight);letter-spacing:.2em;text-transform:uppercase;color:#fff}
.cv-model{position:absolute;top:4.02in;left:0;right:0;text-align:center;font:400 27pt/1 var(--ygh-font-heading);text-transform:uppercase;letter-spacing:.8px;color:var(--ygh-green-dark)}
.cv-model:before,.cv-model:after{content:'';display:inline-block;border-top:.12in solid transparent;border-bottom:.12in solid transparent;vertical-align:.04in;margin:0 .22in}
.cv-model:before{border-left:.2in solid var(--ygh-green)} .cv-model:after{border-right:.2in solid var(--ygh-green)}
.cv-for{position:absolute;top:9.38in;left:0;right:0;text-align:center;font:400 13pt/1 var(--ygh-font-body);letter-spacing:.22em;text-transform:uppercase;color:var(--ygh-green-dark)}
.cv-for b{font-weight:600}
.cv-logo{position:absolute;top:9.8in;left:0;right:0;display:flex;justify-content:center}
.cv-logo img{height:34px} .cv-logo span{font-size:15pt}

/* model list, like Alex's stage list */
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:.16in .45in}
.mlist div{font:400 18pt/1 var(--ygh-font-heading);text-transform:uppercase;letter-spacing:.6px;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline}
.mlist small{font:500 10pt/1 var(--ygh-font-body);letter-spacing:.04em;color:rgba(255,255,255,.6);text-transform:none}
.mlist .on{background:var(--ygh-green);border-radius:3px}
.mlist .on small{color:#fff}
.mlist [data-m]{cursor:pointer;border:1.5px solid transparent;border-radius:3px;transition:background .15s,border-color .15s}
.mlist [data-m]:not(.on):hover{background:rgba(255,255,255,.06)}
.mlist .sel:not(.on){border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.08)}
.viewing{position:absolute;left:12px;bottom:12px;z-index:3;padding:6px 11px;border-radius:3px;background:var(--ygh-green);color:#fff;font:800 9pt/1 var(--ygh-font-highlight);letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.arframe:not(.live) .viewing{display:none}

/* design table, like Alex's stage table */
.tbl{border:2px solid var(--ygh-green-dark);border-radius:4px;overflow:hidden}
.tbl .title{background:var(--ygh-green-dark);color:#fff;text-align:center;padding:.18in;font:400 26pt/1 var(--ygh-font-heading);text-transform:uppercase;letter-spacing:.8px}
.tbl .title em{font-family:var(--ygh-font-highlight);font-style:normal;font-weight:800;background:var(--ygh-green);padding:.02em .2em;border-radius:3px}
.tbl .r{display:grid;grid-template-columns:1.5in 1fr 1fr;border-top:1px solid var(--ygh-grey-light)}
.tbl .r > div{padding:15px 14px;font:400 11pt/1.4 var(--ygh-font-body);color:var(--ygh-ink);display:flex;align-items:center}
.tbl .r > div:first-child{background:var(--ygh-green);color:#fff;font:800 10pt/1.2 var(--ygh-font-highlight);letter-spacing:.1em;text-transform:uppercase}

<div id="doc"></div>
<script>
//---------------------------------------------------------------------

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;
